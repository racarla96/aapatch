plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.aapatch.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.aapatch.app'
        minSdk 26
        targetSdk 35
        // CI: every build gets a higher version, so each one installs over the previous one.
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode run
        versionName "0.3.${run}"
    }

    // Fixed debug key (committed on purpose): without it every CI run signs with a fresh random key
    // and Android refuses to install the new APK over the old one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            // The patcher core is shared with the desktop CLI: one copy of the code.
            java {
                srcDir '../../src'
                exclude 'aapatch/Cli.java'
                exclude 'aapatch/Dump.java'
            }
        }
    }

    lint { abortOnError false }
}
// No third-party dependencies on purpose.
