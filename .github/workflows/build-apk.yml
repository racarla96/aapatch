name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AAPatcher-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AAPatcher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AAPatcher.apk --target "$GITHUB_SHA" \
            --title "AA Patcher (último build)" \
            --notes "APK debug generado automáticamente en cada push."
